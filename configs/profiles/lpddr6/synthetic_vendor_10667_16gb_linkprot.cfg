# 用于测试的 LPDDR6 合成厂商式配置。
#
# 本文件不对应任何真实 LPDDR6 厂商。它用于在没有真实手册时测试用户提供的
# 厂商式配置、时序来源标记、链路保护开销、WCK 训练和命令轨迹流程。
#
# 来源标记为 vendor，用于模拟用户提供的校准数据；这些数值只能作为合成测试值。
source = vendor
note = Synthetic vendor-like LPDDR6 test profile; not from a real vendor datasheet.

timing_profile = lpddr6_synthetic_vendor_10667_16gb_linkprot
vendor_profile = synthetic_vendor
mode_profile = dvfsl_linkprot_on_eff_on_bl24_test

