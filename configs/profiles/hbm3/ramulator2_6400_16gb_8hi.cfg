# HBM3 Ramulator2.1-derived 6400Mbps、16Gb、8-high 基线。
#
# HBM3 用作 HBM4 实验的对照。在导入完整 HBM3 JEDEC/厂商时序表前，
# 本配置对应 hbm_sim 的 HBM3 preset，并参考 Ramulator2.1 HBM3 模型：
#   - 组织：HBM3_8Gb_8hi，完整堆叠 16 通道
#   - 时序：HBM3_6400Mbps 风格的控制器可见数值
#   - 层级：channel、pseudo-channel、SID、bank group、bank、row、column
#
# 本文件不是校准后的 HBM3 器件配置，只是稳定的 Ramulator2.1 风格研究基线。
source = research_default
note = Ramulator2.1-derived HBM3 baseline; replace with HBM3 JEDEC/vendor tables before numerical device claims.

timing_profile = hbm3_ramulator2_6400_16gb_8hi
vendor_profile = ramulator2_baseline
mode_profile = default

speed_bin_mbps = 6400
density_gb = 16
stack_height = 8
data_rate_mbps = 6400
data_bus_bits = 1024
tick_multiplier = 2
tCK_ps = 625

channels = 16
pseudo_channels = 2
sids = 1
ranks = 1
bank_groups = 4
banks_per_group = 4
rows = 32768
columns = 32
line_size = 64

hbm_edge_pairing = true
hbm_edge_pairing_matrix = hbm3_row_col_pre_pairing
hbm_sid_mapping = single_sid
hbm_ecc_scheme = none
hbm_ras_policy = counter_only

nBL = 2
nCL = 26
nCWL = 8
nRCDRD = 26
nRCDWR = 14
nRP = 26
nRAS = 48
nRC = 74
nRTP = 6
nWR = 24
nCCDS = 2
nCCDL = 4
nCCDR = 3
nRRDS = 8
nRRDL = 8
nFAW = 24
nRTW = 18
nWTRS = 8
nWTRL = 12
nMRW = 8
nMRR = 8
nECCSCRUB = 0
nRASERR = 0
nLINKRETRY = 0

# 刷新参数使用 JEDEC 风格单位，并采用当前模型明确的控制器可见换算。
# 由于尚未导入完整 HBM3 标准或厂商表，来源仍标记为 research_default。
tRFCab_ns = 350
tRFCpb_ns = 200
tRREFD_ns = 8
tREFI_us = 3.9
tREFIpb_ns = 121.875
