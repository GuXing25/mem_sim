# LPDDR5 Ramulator2.1-derived 6400Mbps、16Gb 基线。
#
# LPDDR5 用作 LPDDR6 实验的对照。项目尚未包含完整 LPDDR5 JESD209/厂商
# 时序表，因此本配置对应 hbm_sim LPDDR5 preset 和 Ramulator2.1 风格命令模型：
#   - ACT1/ACT2 分裂激活
#   - RD/WR 前执行 CAS_RD/CAS_WR 同步
#   - 单紧凑通道及 rank、bank-group、bank、row、column 层级
#   - per-bank 和 all-bank 刷新命令
#
# 本文件不是校准后的 LPDDR5 器件配置，只用于可复现的架构和控制器比较。
source = research_default
note = Ramulator2.1-derived LPDDR5 baseline; replace with LPDDR5 JEDEC/vendor tables before numerical device claims.

timing_profile = lpddr5_ramulator2_6400_16gb
vendor_profile = ramulator2_baseline
mode_profile = default

speed_bin_mbps = 6400
density_gb = 16
data_rate_mbps = 6400
data_bus_bits = 16
prefetch_size = 16
tick_multiplier = 1
tCK_ps = 1250

channels = 1
pseudo_channels = 1
sids = 1
ranks = 1
bank_groups = 4
banks_per_group = 4
rows = 65536
columns = 1024
line_size = 64

lpddr_link_protection = false
lpddr_mode_register_profile = ramulator2_baseline
lpddr_wck_training_mode = cas_sync_only
lpddr_dvfs_transition_policy = disabled
lpddr_link_protection_mode = off
lpddr_low_power_state_policy = controller_idle
lpddr_wck_training_required = false
lpddr_dbi_enabled = false
lpddr_link_ecc_enabled = false
lpddr_ca_parity_enabled = false
lpddr_dbi_bits_per_request = 0
lpddr_link_ecc_bits_per_request = 0
lpddr_ca_parity_bits_per_command = 1

nBL = 2
nCL = 17
nCWL = 9
nRCDRD = 15
nRCDWR = 15
nRP = 15
nRPab = 17
nRAS = 34
nRC = 49
nRTP = 8
nWR = 28
nCCDS = 2
nCCDL = 4
nRRDS = 4
nRRDL = 4
nFAW = 16
nAAD = 8
nWCK2CK = 1
nWCKPST = 1
nCAS = 0
nCS = 2
nPPD = 2
nWTRS = 5
nWTRL = 10
nRFC = 224
nRFCpb = 112
nREFI = 3125
nREFIpb = 391
nWCKSYNC = 1
nWCKTRAIN = 0
nDVFS = 0
nPDEX = 0
nSREFEX = 0
nECCSCRUB = 0
nRASERR = 0
nLINKRETRY = 0
