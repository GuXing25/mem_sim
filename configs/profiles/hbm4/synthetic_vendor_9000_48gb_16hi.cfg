# 用于测试的 HBM4 合成厂商式配置。
#
# 本文件不对应任何真实 HBM4 厂商。它用于在没有真实手册时测试控制器实验、
# 严格时序表检查、命令轨迹验证和完整“厂商式”配置路径。
#
# 来源标记为 vendor，仅用于让 --strict-timing-table 验证配置通路。
# 下列数值是合成测试值，不能作为真实器件数据引用。
source = vendor
note = Synthetic vendor-like HBM4 test profile; not from a real vendor datasheet.

timing_profile = hbm4_synthetic_vendor_9000_48gb_16hi
vendor_profile = synthetic_vendor
mode_profile = full_stack_crc16_ras_test

speed_bin_mbps = 9000
density_gb = 48
stack_height = 16
data_rate_mbps = 9000
data_bus_bits = 2048
tick_multiplier = 2
tCK_ps = 444

channels = 32
pseudo_channels = 2
sids = 4
ranks = 1
bank_groups = 2
banks_per_group = 8
rows = 16384
columns = 32
line_size = 64
dram_transaction_bytes = 32

supports_refresh = true
supports_rfm = true
supports_ecc = true
hbm_full_32_channel_stack = true
hbm_sid_interleave = true
hbm_pc_interleave = true
hbm_edge_pairing = true
hbm_strict_edge_pairing = true
hbm_edge_pairing_matrix = hbm4_synthetic_full_matrix
hbm_sid_mapping = sid_per_4hi_slice
hbm_ecc_scheme = metadata_16b_per_32B_transaction
hbm_ras_policy = ras_metadata_sideband
hbm_link_crc_mode = crc16
hbm_link_retry_enabled = true
hbm_link_crc_bits_per_request = 16
hbm_ras_metadata_bits_per_request = 16
hbm_ecc_bits_per_request = 16

nBL = 2
nCL = 36
nCWL = 12
nRCDRD = 36
nRCDWR = 20
nRP = 36
nRPab = 36
nRAS = 64
nRC = 100
nRTP = 10
nWR = 34
nCCDS = 2
tCCDL_ns = 2.5
nCCDR = 4
nRRDS = 10
nRRDL = 12
nFAW = 36
nRTW = 30
nWTRS = 12
nWTRL = 16

tRFCab_ns = 560
tRFCpb_ns = 350
tRREFD_ns = 8
tREFI_us = 3.9
tREFIpb_ns = 60.9375
nRFMab = 1262
nRFMpb = 789

nMRW = 10
nMRR = 10
nECCSCRUB = 160
nRASERR = 96
nLINKRETRY = 40
