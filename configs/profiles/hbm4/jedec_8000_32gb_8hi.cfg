# HBM4 JESD270-4A-oriented 配置片段。
# 这是控制器可见配置，不是完整厂商手册。
source = jedec
note = HBM4 JESD270-4A-oriented 8.0Gbps/pin, 32Gb/die, 8-high full-stack fragment.

timing_profile = hbm4_jedec_8000_32gb_8hi
mode_profile = full_stack_crc_off
speed_bin_mbps = 8000
density_gb = 32
stack_height = 8
tCK_ps = 500

channels = 32
pseudo_channels = 2
sids = 2
bank_groups = 2
banks_per_group = 8
data_bus_bits = 2048
dram_transaction_bytes = 32
tick_multiplier = 2
hbm_full_32_channel_stack = true
hbm_sid_interleave = true
hbm_pc_interleave = true
hbm_edge_pairing = true
hbm_strict_edge_pairing = true
hbm_edge_pairing_matrix = hbm4_jedec270_4a_row_col_pre_matrix
hbm_sid_mapping = sid_pair_8hi
hbm_ecc_scheme = metadata_16b_per_32B_transaction
hbm_ras_policy = counter_only
hbm_link_crc_mode = off
hbm_link_retry_enabled = false
hbm_ecc_bits_per_request = 16

nBL = 2
nCCDS = 2
tCCDL_ns = 2.5
nCCDR = 3
tRFCab_ns = 450
tRFCpb_ns = 280
tRREFD_ns = 8
tREFI_us = 3.9
tREFIpb_ns = 121.875

source = research_default
note = HBM4 row/RL/WL values are explicitly tagged research defaults until a target vendor speed-bin table is supplied.
nCL = 30
nCWL = 10
nRCDRD = 30
nRCDWR = 16
nRP = 30
nRPab = 30
nRAS = 54
nRC = 84
nRTP = 8
nWR = 28
nRRDS = 8
nRRDL = 10
nFAW = 28
nRTW = 25
nWTRS = 9
nWTRL = 13
nMRW = 8
nMRR = 8
nECCSCRUB = 128
