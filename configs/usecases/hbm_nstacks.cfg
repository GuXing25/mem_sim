# HBM 多 Stack 完整运行用例。默认创建两颗独立 HBM4 Stack，每颗 Stack 拥有自己的
# ingress、channel controller、Behavioral PHY、MemoryImage、功耗和热状态。

[meta]
extends = ../hbm.cfg  # 基础配置路径；相对本文件所在目录解析

[model]
name = hbm_two_stack_case  # 运行实例名称，仅用于结果标识
base_standard = hbm4  # 默认协议标准；可用 --standard hbm3 运行 HBM3 多 Stack

[override]
stack_count = 2  # 独立 HBM Stack 数量；可由 --stack-count 扩展
stack_mapping = interleaved  # 按固定条带在各 Stack 之间轮转系统地址
stack_interleave_bytes = 256  # Stack 地址条带粒度，单位 Byte，必须是 line_size 的整数倍
stack_ingress_buffer_size = 256  # 每颗 Stack 的入口队列容量，单位 transaction
stack_dispatch_width = 4  # 每颗 Stack 每个 system tick 最多分发的 transaction 数
stack_qos_policy = strict_priority  # Stack 入口先比较 qos，同优先级保持可重放顺序
requests = 4096  # 合成 Host 请求数量；较大负载便于观察 Stack 间分布
pattern = random  # 合成访问模式；避免 stream 仅覆盖少量地址区域
read_ratio = 80  # 读请求比例，单位百分比
seed = 11  # 随机流量种子；固定后可以重放同一请求序列
inject_interval = 1  # 相邻请求最早注入间隔，单位 system tick
mem_phy_mode = behavioral  # 每个 [stack][channel] 使用独立 Behavioral PHY
memory_backend = sparse  # 使用每 Stack 独立的进程内稀疏后端
floorplan = true  # 为每颗 Stack 独立派生 layer/tile/thermal-grid 坐标
power_model = true  # 分别累计每颗 Stack 的活动能量
thermal_model = true  # 分别维护每颗 Stack 的行为级热状态
validate_cmd_trace = true  # 检查所有 Stack 的命令状态与 Timing 合法性
validate_dfi_trace = true  # 检查所有 Behavioral PHY 的 DFI 事件顺序

