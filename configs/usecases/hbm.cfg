# HBM 单 Stack 完整运行用例。该文件继承标准主配置，命令行只需指定本文件。
# 使用 --dump-resolved-config 可查看继承后真正参与运行的全部参数及来源。

[meta]
extends = ../hbm.cfg  # 基础配置路径；相对本文件所在目录解析

[model]
name = hbm_single_stack_case  # 运行实例名称，仅用于结果标识
base_standard = hbm4  # 默认使用 HBM4；需要 HBM3 时可用 --standard hbm3 覆盖

[override]
stack_count = 1  # 独立 HBM Stack 数量；本用例固定为单 Stack
stack_mapping = interleaved  # 系统地址到 Stack 的映射；单 Stack 下不改变目标选择
stack_interleave_bytes = 256  # 多 Stack 地址条带粒度，单位 Byte；单 Stack 下保留统一口径
requests = 2048  # 合成 Host 请求数量；可由 --requests 覆盖
pattern = random  # 合成访问模式；random 用于展开 channel/bank 并行性
read_ratio = 80  # 读请求比例，单位百分比
seed = 11  # 随机流量种子；固定后可以重放同一请求序列
inject_interval = 1  # 相邻请求最早注入间隔，单位 system tick
mem_phy_mode = behavioral  # 使用包含 FIFO、训练和 DFI 事件的行为级 PHY
memory_backend = sparse  # 使用进程内稀疏数据后端，适合快速运行
floorplan = true  # 启用逻辑地址到 layer/tile/thermal-grid 坐标映射
power_model = true  # 启用命令和 payload 活动能量统计
thermal_model = true  # 启用行为级稀疏热耦合模型
validate_cmd_trace = true  # 运行结束后检查命令状态与 Timing 合法性
validate_dfi_trace = true  # 运行结束后检查 Behavioral PHY 的 DFI 事件顺序

