# LPDDR 多实例完整运行用例。系统复用 stack_count 作为独立 device/package 数量，
# 不表示 LPDDR 器件内部一定采用与 HBM 相同的 TSV Stack 结构。

[meta]
extends = ../lpddr.cfg  # 基础配置路径；相对本文件所在目录解析

[model]
name = lpddr_two_device_case  # 运行实例名称，仅用于结果标识
base_standard = lpddr6  # 默认协议标准；可用 --standard lpddr5 运行 LPDDR5 多实例

[override]
stack_count = 2  # 独立 LPDDR device/package 实例数量
stack_mapping = interleaved  # 按固定条带在各器件实例之间轮转系统地址
stack_interleave_bytes = 256  # 实例地址条带粒度，单位 Byte，必须是 line_size 的整数倍
stack_ingress_buffer_size = 256  # 每个实例的入口队列容量，单位 transaction
stack_dispatch_width = 4  # 每个实例每个 system tick 最多分发的 transaction 数
stack_qos_policy = strict_priority  # 入口先比较 qos，同优先级保持可重放顺序
requests = 4096  # 合成 Host 请求数量；较大负载便于观察实例间分布
pattern = random  # 合成访问模式；避免 stream 仅覆盖少量地址区域
read_ratio = 80  # 读请求比例，单位百分比
seed = 11  # 随机流量种子；固定后可以重放同一请求序列
inject_interval = 1  # 相邻请求最早注入间隔，单位 system tick
mem_phy_mode = behavioral  # 每个 [instance][channel] 使用独立 Behavioral PHY
memory_backend = sparse  # 使用每实例独立的进程内稀疏后端
floorplan = true  # 为每个实例独立派生物理层次及热网格坐标
power_model = true  # 分别累计每个实例的活动能量
thermal_model = true  # 分别维护每个实例的行为级热状态
validate_cmd_trace = true  # 检查所有实例的命令状态与 Timing 合法性
validate_dfi_trace = true  # 检查所有 Behavioral PHY 的 DFI 事件顺序

