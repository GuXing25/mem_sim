# LPDDR 单器件完整运行用例。LPDDR 在系统层仍使用 stack_count 表示独立器件实例数，
# 这里的“Stack”不等同于 HBM 的 TSV 堆叠结构。

[meta]
extends = ../lpddr.cfg  # 基础配置路径；相对本文件所在目录解析

[model]
name = lpddr_single_device_case  # 运行实例名称，仅用于结果标识
base_standard = lpddr6  # 默认使用 LPDDR6；需要 LPDDR5 时可用 --standard lpddr5 覆盖

[override]
stack_count = 1  # 独立 LPDDR device/package 实例数量
stack_mapping = interleaved  # 系统地址到器件实例的映射；单实例下不改变目标选择
stack_interleave_bytes = 256  # 多实例地址条带粒度，单位 Byte
requests = 2048  # 合成 Host 请求数量；可由 --requests 覆盖
pattern = random  # 合成访问模式；random 用于覆盖更多 bank/row
read_ratio = 80  # 读请求比例，单位百分比
seed = 11  # 随机流量种子；固定后可以重放同一请求序列
inject_interval = 1  # 相邻请求最早注入间隔，单位 system tick
mem_phy_mode = behavioral  # 使用包含 FIFO、训练和 DFI 事件的行为级 PHY
memory_backend = sparse  # 使用进程内稀疏数据后端
floorplan = true  # 启用逻辑地址到物理层次及热网格的行为级映射
power_model = true  # 启用命令和 payload 活动能量统计
thermal_model = true  # 启用行为级稀疏热耦合模型
validate_cmd_trace = true  # 运行结束后检查命令状态与 Timing 合法性
validate_dfi_trace = true  # 运行结束后检查 Behavioral PHY 的 DFI 事件顺序

