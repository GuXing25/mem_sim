# HBM3 校准入口。
#
# 项目尚未包含完整 HBM3 JEDEC/厂商时序表。本文件封装
# Ramulator2.1-derived HBM3 基线，用于保持 HBM3/HBM4 实验结构一致；
# 不能把它与 --strict-timing-table 的通过结果当作 HBM3 器件校准证据。

standard = hbm3
timing_profile = hbm3_ramulator2_6400_16gb_8hi
timing_profile_file = configs/profiles/hbm3/ramulator2_6400_16gb_8hi.cfg
vendor_profile = ramulator2_baseline
mode_profile = default

pattern = random
requests = 10000
read_ratio = 75
seed = 11
inject_interval = 1
address_mapping = default
read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 2048

channels = 16
pseudo_channels = 2
sids = 1
ranks = 1
stack_height = 8
density_gb = 16
bank_groups = 4
banks_per_group = 4
rows = 32768
columns = 32
line_size = 64

data_rate_mbps = 6400
speed_bin_mbps = 6400
data_bus_bits = 1024
prefetch_size = 8
tick_multiplier = 2
tCK_ps = 625
full_stack_model = true

hbm_edge_pairing = true
hbm_strict_edge_pairing = false
hbm_sid_interleave = false
hbm_pc_interleave = true
hbm_edge_pairing_matrix = hbm3_row_col_pre_pairing
hbm_sid_mapping = single_sid
hbm_ecc_scheme = none
hbm_ras_policy = counter_only
hbm_link_crc_mode = off
hbm_link_retry_enabled = false
supports_ecc = false

supports_refresh = true
refresh_policy = per_bank
supports_rfm = true
rfm_policy = per_bank
rfm_act_threshold = 256
rfm_decrement = 256
refresh_postpone_limit = 0
refresh_pullin_limit = 0
refresh_credit_limit = 0
refresh_temperature_mode = normal

max_cycles = 100000000
