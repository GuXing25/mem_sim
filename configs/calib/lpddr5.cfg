# LPDDR5 校准入口。
#
# 项目尚未包含完整 LPDDR5 JEDEC/厂商时序表。本文件封装
# Ramulator2.1-derived LPDDR5 基线，用于保持 LPDDR5/LPDDR6 实验结构一致；
# 获得真实标准或厂商表后应替换 timing_profile_file。

standard = lpddr5
timing_profile = lpddr5_ramulator2_6400_16gb
timing_profile_file = configs/profiles/lpddr5/ramulator2_6400_16gb.cfg
vendor_profile = ramulator2_baseline
mode_profile = default

pattern = stream
requests = 10000
read_ratio = 100
addr_stride = 64
inject_interval = 1
address_mapping = default
read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 512

channels = 1
pseudo_channels = 1
sids = 1
ranks = 1
density_gb = 16
bank_groups = 4
banks_per_group = 4
rows = 32768
columns = 1024
line_size = 64

data_rate_mbps = 6400
speed_bin_mbps = 6400
data_bus_bits = 16
prefetch_size = 16
tick_multiplier = 1
tCK_ps = 1250

supports_refresh = true
refresh_policy = per_bank
supports_rfm = false
rfm_policy = per_bank
refresh_postpone_limit = 0
refresh_pullin_limit = 0
refresh_credit_limit = 0
refresh_temperature_mode = normal

lpddr_link_protection = false
lpddr_dvfs_mode = disabled
lpddr_low_data_rate_mbps = 0
lpddr_wck_mode = cas_sync
lpddr_wck_ratio = 4
lpddr_mode_register_profile = ramulator2_baseline
lpddr_wck_training_mode = cas_sync_only
lpddr_dvfs_transition_policy = disabled
lpddr_link_protection_mode = off
lpddr_low_power_state_policy = controller_idle
lpddr_wck_training_required = false
lpddr_dbi_enabled = false
lpddr_link_ecc_enabled = false
lpddr_ca_parity_enabled = false
metadata_bits_per_request = 0
lpddr_dbi_bits_per_request = 0
lpddr_link_ecc_bits_per_request = 0
lpddr_ca_parity_bits_per_command = 1
low_power_mode = off
low_power_entry_cycles = 0
low_power_exit_cycles = 0
self_refresh_exit_cycles = 0

max_cycles = 100000000
