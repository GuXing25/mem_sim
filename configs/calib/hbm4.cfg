# HBM4 JEDEC/厂商时序模板。
# 默认假设：JESD270-4A、8.0Gbps/pin、tCK=500ps、32Gb/die、8-high stack。
# 这个文件的用途是“把 preset 显式展开成可审计配置”，方便把 JEDEC/vendor 表逐项替换。
#
# 重要说明：
# - nCL/nCWL/nRCD*/nRP/nRAS/nRC/nRTP/nWR/nRRD/nFAW 等行/列时序仍应按目标器件
#   speed-bin、density、stack height 和 vendor datasheet 校准；
# - tRFCab/tRFCpb/tREFI/tREFIpb 使用 ns/us 输入，main.cpp 会按 tCK_ps 向上换算到 nCK；
# - strict_timing_table=true 时，如果还有 vendor_required timing 未覆盖，程序会报错。

standard = hbm4
timing_profile = hbm4_jedec_8g_32gb_8hi
timing_profile_file = configs/profiles/hbm4/jedec_8000_32gb_8hi.cfg
vendor_profile = generic
mode_profile = default
pattern = stream
requests = 10000
read_ratio = 90
inject_interval = 1
# 地址映射必须和对照模型一致。default 偏向连续列访问；RoBaRaCoCh 等模板更适合
# 模拟 cache-line interleave 到 channel 的实验。
address_mapping = default
read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 4096

# 组织结构：HBM4 默认按完整 stack 口径建模。若只研究单 channel slice，
# 可以把 channels 改成 1，同时 data_bus_bits 也要按 slice 宽度相应调整。
channels = 32
pseudo_channels = 2
sids = 2
stack_height = 8
density_gb = 32
bank_groups = 2
banks_per_group = 8
rows = 16384
columns = 32
line_size = 64
# host/cache line 保持 64B；HBM4 单 PC 的 32DQ × BL8 事务为 32B。
dram_transaction_bytes = 32

data_rate_mbps = 8000
speed_bin_mbps = 8000
data_bus_bits = 2048
# tick_multiplier=2 表示一个 nCK 拆成 rising/falling 两个 controller tick，
# 用于表达 HBM edge pairing/半周期发射。
tick_multiplier = 2
tCK_ps = 500
hbm_edge_pairing = true
hbm_strict_edge_pairing = true
hbm_sid_interleave = true
hbm_pc_interleave = true
hbm_full_32_channel_stack = true
hbm_edge_pairing_matrix = hbm4_jedec270_4a_row_col_pre_matrix
hbm_sid_mapping = sid_pair_8hi
hbm_ecc_scheme = metadata_16b_per_32B_transaction
hbm_ras_policy = counter_only
hbm_link_crc_mode = off
hbm_link_retry_enabled = false
# refresh/RFM 策略可在 per_bank 与 all_bank 间切换；per_bank 更适合研究维护命令交错。
supports_refresh = true
refresh_policy = per_bank
supports_rfm = true
rfm_policy = per_bank
supports_ecc = true
# RFM 阈值/递减值是研究默认入口，真实数值请按 HBM4 RAA/RFM 规则覆盖。
rfm_act_threshold = 256
rfm_decrement = 256
ecc_bits_per_request = 0
hbm_ecc_bits_per_request = 16
hbm_link_crc_bits_per_request = 0
hbm_ras_metadata_bits_per_request = 0
refresh_postpone_limit = 0
refresh_pullin_limit = 0
refresh_credit_limit = 0
refresh_temperature_mode = normal

# 下方 timing 字段全部是 nCK，除显式 *_ns/*_us 字段外。
# timing_override_source 会标记“后续 timing 覆盖项”的来源：
# - research_default：项目为了可运行而给出的研究默认值，strict 模式应继续提醒校准；
# - jedec：由公开标准公式/固定约束换算得到的值；
# - vendor：目标器件 datasheet/vendor guide 已校准值。
#
# 这些行/列 timing 仍是研究默认值，适合做框架 smoke run，不适合作数值级结论。
timing_override_source = research_default
nCL = 30
nCWL = 10
nRCDRD = 30
nRCDWR = 16
nRP = 30
nRAS = 54
nRC = 84
nRTP = 8
nWR = 28
nCCDR = 3
nRRDS = 8
nRRDL = 10
nFAW = 28
nRTW = 25
nWTRS = 9
nWTRL = 13

# burst、列总线间隔和 refresh/RFM 模板项按 JEDEC 公开框架或公式展开；
# 若目标 vendor 对这些值有更严格要求，请在 vendor profile 中重新覆盖。
timing_override_source = jedec
nBL = 2
nCCDS = 2
nCCDL = 5
# tRFC/tRREFD/tREFI 用真实时间单位写入，避免手工换算造成 off-by-one。
tRFCab_ns = 450
tRFCpb_ns = 280
nRFMab = 900
nRFMpb = 560
tRREFD_ns = 8
tREFI_us = 3.9
tREFIpb_ns = 121.875

# 模板分段结束后恢复默认来源，便于后续 CLI/配置追加的 timing 覆盖被视为
# 目标器件校准值，除非再次显式写 timing_override_source。
timing_override_source = vendor
