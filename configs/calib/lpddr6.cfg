# LPDDR6 JEDEC/厂商时序模板。
# 默认假设：JESD209-6、10667Mbps、tCK=375ps、BL24、DVFSL enabled、
# link protection disabled、static/dynamic efficiency enabled、12/16Gb density。
#
# 使用方式：
# - 这个模板把 LPDDR6 preset 显式展开，便于逐项替换成目标 device/speed-bin 表；
# - nCL/nCWL 来自 read/write latency set，做数值级对比时必须按器件 mode/register 表确认；
# - nRFC/nRFCpb/nREFI/nREFIpb 与 density/refresh mode 强相关，必须核对目标容量；
# - link protection、DBI/ECC 当前只通过 metadata_bits_per_request 影响接口带宽统计。

standard = lpddr6
timing_profile = lpddr6_jedec_10667_16gb
timing_profile_file = configs/profiles/lpddr6/jedec_nominal_10667_16gb.cfg
vendor_profile = generic
mode_profile = dvfsl_linkprot_off_bl24
pattern = stream
requests = 10000
read_ratio = 100
inject_interval = 1
address_mapping = default
read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 512

# JESD209-6 x24 device：两个 x12 subchannel；16Gb/subchannel 表项为
# 65536 rows × 64 column transactions。BL24 每个 subchannel 传输
# 256-bit data + 32-bit non-data，因此 payload 是 32B。
channels = 1
pseudo_channels = 2
sids = 1
ranks = 1
bank_groups = 4
banks_per_group = 4
rows = 65536
columns = 64
# 64B 是 host/frontend line；每条 line 拆成两个 32B LPDDR6 transactions。
line_size = 64
dram_transaction_bytes = 32

data_rate_mbps = 10667
speed_bin_mbps = 10667
density_gb = 16
data_bus_bits = 24
prefetch_size = 24
tick_multiplier = 1
tCK_ps = 375
# LPDDR6 per_bank refresh 在 hbm_sim 中对应 REFdb dual-bank refresh。
supports_refresh = true
refresh_policy = per_bank
lpddr_dual_bank_refresh = true
supports_rfm = true
rfm_policy = per_bank
# PRAC/RFM 阈值和递减值是研究默认入口，真实数值需按 JESD209-6/vendor 规则覆盖。
rfm_act_threshold = 512
rfm_decrement = 512
lpddr_efficiency_mode = normal
lpddr_dvfs_mode = nominal
lpddr_low_data_rate_mbps = 4267
lpddr_wck_mode = cas_sync
lpddr_wck_ratio = 4
lpddr_mode_register_profile = RLSet1_WLSetA
lpddr_wck_training_mode = startup_and_dvfs_retrain
lpddr_dvfs_transition_policy = idle_channel_nacu_guarded
lpddr_link_protection_mode = off
lpddr_low_power_state_policy = controller_idle
lpddr_wck_training_required = true
lpddr_link_protection = false
lpddr_dbi_enabled = false
lpddr_link_ecc_enabled = false
lpddr_ca_parity_enabled = false
metadata_bits_per_request = 0
lpddr_dbi_bits_per_request = 0
lpddr_link_ecc_bits_per_request = 0
lpddr_ca_parity_bits_per_command = 1
refresh_postpone_limit = 0
refresh_pullin_limit = 0
refresh_credit_limit = 0
refresh_temperature_mode = normal
low_power_mode = off
low_power_entry_cycles = 0
low_power_exit_cycles = 0
self_refresh_exit_cycles = 0

# 下方 timing 字段是 nCK；如果用 *_ns/*_us 写法，CLI 会按 tCK_ps 向上换算。
# nAAD/nWCK2CK/nWCKPST/nCAS 是 LPDDR6 WCK/CAS 行为最关键的字段。
nBL = 6
nCL = 62
nCWL = 26
nRCDRD = 56
nRCDWR = 25
nRP = 123
nRPab = 132
nRAS = 54
nRC = 177
nRTP = 10
nWR = 43
nCCDS = 6
nCCDL = 10
nRRDS = 10
nRRDL = 10
nFAW = 40
nAAD = 8
nWCK2CK = 22
nWCKPST = 3
nCAS = 22
nWTRS = 26
nWTRL = 43
nRREFD = 20
nRFC = 747
# LPDDR6 使用 REFdb；hbm_sim 将 REFdb 的 tRFCdb 保存到 nRFCpb。
nRFCpb = 427
nRFMab = 747
nRFMpb = 427
nREFI = 10416
nREFIpb = 1302
