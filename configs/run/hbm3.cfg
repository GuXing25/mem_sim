# HBM3 Ramulator2.1-derived 研究基线。
#
# 用本文件作为 HBM4 实验的 HBM3 对照。项目尚未导入完整 HBM3
# JEDEC/厂商时序表，因此该配置标记为 Ramulator2.1-derived 研究基线，
# 不是完整校准的 HBM3 器件配置。

standard = hbm3
timing_profile = hbm3_generic
timing_profile_file = configs/profiles/hbm3/ramulator2_6400_16gb_8hi.cfg
vendor_profile = ramulator2_baseline
mode_profile = default

speed_bin_mbps = 6400
density_gb = 16
stack_height = 8

pattern = random
requests = 10000
read_ratio = 75
seed = 11
address_mapping = default
inject_interval = 1

read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 2048

# MC -> DFI-oriented HBM PHY -> Mem Stack。Direct 可用于历史结果复现。
mem_phy_mode = behavioral
dfi_version = 6.0.1
phy_command_fifo_depth = 32
phy_read_fifo_depth = 32
phy_write_fifo_depth = 32
phy_command_pipeline_cycles = 1
phy_read_return_pipeline_cycles = 1
phy_write_data_pipeline_cycles = 1
phy_reset_cycles = 4
phy_initialization_cycles = 4
phy_training_cycles = 8
phy_auto_train = true

refresh_policy = per_bank
rfm_policy = per_bank
refresh_temperature_mode = normal

max_cycles = 100000000
