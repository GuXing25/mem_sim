# 六颗独立 HBM4 stack 的系统级运行配置。
# 每颗 stack 都有自己的 32-channel Controller 阵列、MemoryImage、刷新/RFM、
# 功耗和热状态；系统地址按 256B 条带分布，stack 入口使用严格优先级 QoS。

standard = hbm4
timing_profile = hbm4_jedec_8g_32gb_8hi
timing_profile_file = configs/profiles/hbm4/jedec_8000_32gb_8hi.cfg
vendor_profile = generic
mode_profile = full_stack_crc_off

stack_count = 6
stack_mapping = interleaved
stack_interleave_bytes = 256
stack_ingress_buffer_size = 256
stack_dispatch_width = 4
stack_qos_policy = strict_priority

pattern = stream
requests = 10000
read_ratio = 90
addr_stride = 64
inject_interval = 1

read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 4096

# 每个 stack/channel controller 拥有独立的行为级 HBM PHY 状态和 FIFO。
mem_phy_mode = behavioral
dfi_version = 6.0.1
phy_command_fifo_depth = 64
phy_read_fifo_depth = 64
phy_write_fifo_depth = 64
phy_command_pipeline_cycles = 1
phy_read_return_pipeline_cycles = 1
phy_write_data_pipeline_cycles = 1
phy_reset_cycles = 4
phy_initialization_cycles = 4
phy_training_cycles = 8
phy_auto_train = true

refresh_policy = per_bank
supports_rfm = true
rfm_policy = per_bank
supports_ecc = true
max_cycles = 100000000
