# LPDDR6 JEDEC-oriented 研究运行配置。
#
# 这是 LPDDR6 主要快速运行配置，默认使用 nominal 配置片段。将标准或
# 厂商表转换为严格数值配置时，使用 configs/calib/lpddr6.cfg。

standard = lpddr6
timing_profile = lpddr6_jedec_10667_16gb
timing_profile_file = configs/profiles/lpddr6/jedec_nominal_10667_16gb.cfg
vendor_profile = generic
mode_profile = dvfsl_linkprot_off_bl24

speed_bin_mbps = 10667
density_gb = 16

# JESD209-6 x24 device = two x12 subchannels. A BL24 command carries
# 256 data bits (32B) per subchannel; the 64B host line is split into two.
channels = 1
pseudo_channels = 2
sids = 1
ranks = 1
bank_groups = 4
banks_per_group = 4
rows = 65536
columns = 64
line_size = 64
dram_transaction_bytes = 32
data_bus_bits = 24
prefetch_size = 24

pattern = stream
requests = 10000
read_ratio = 100
addr_stride = 64
address_mapping = default
inject_interval = 1

read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 512

# MC -> DFI-oriented LPDDR PHY -> Mem Stack；DVFS 后仍需显式 WCK retraining。
mem_phy_mode = behavioral
dfi_version = 6.0.1
phy_command_fifo_depth = 32
phy_read_fifo_depth = 32
phy_write_fifo_depth = 32
phy_command_pipeline_cycles = 1
phy_read_return_pipeline_cycles = 1
phy_write_data_pipeline_cycles = 1
phy_reset_cycles = 4
phy_initialization_cycles = 4
phy_training_cycles = 8
phy_auto_train = true

refresh_policy = per_bank
rfm_policy = per_bank

lpddr_efficiency_mode = normal
lpddr_dvfs_mode = nominal
lpddr_wck_mode = cas_sync
lpddr_link_protection = false
lpddr_dbi_enabled = false
lpddr_link_ecc_enabled = false
low_power_mode = off

max_cycles = 100000000
