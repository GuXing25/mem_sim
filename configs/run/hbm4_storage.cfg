# HBM4 数据、存储后端、功耗与热模型的统一入口。
#
# 默认使用内存内 sparse 后端，直接运行不会创建后端二进制文件：
#   ./build-clang-debug/hbm_sim --config configs/run/hbm4_storage.cfg
#
# 后端只是宿主机保存方式，不会补充或替代 hbm4.cfg 的标准参数。完整最终配置
# 始终按“标准 preset < timing profile < 本文件 < 后置 CLI 参数”合成。
# 切换 mmap（会创建 data/init/meta/present 四个文件）：
#   ./build-clang-debug/hbm_sim --config configs/run/hbm4_storage.cfg \
#     --memory-backend mmap_sparse --memory-capacity-bytes 1073741824 \
#     --memory-data-file outputs/hbm4_storage/backend/hbm4_mmap.bin
# 切换有界 chunk cache：
#   ./build-clang-debug/hbm_sim --config configs/run/hbm4_storage.cfg \
#     --memory-backend chunk_file --memory-capacity-bytes 1073741824 \
#     --memory-data-file outputs/hbm4_storage/backend/hbm4_chunk.bin \
#     --memory-chunk-size 2097152 --memory-chunk-cache-entries 16

standard = hbm4
pattern = stream
trace = examples/data_check.trace
requests = 0
max_cycles = 4000
inject_interval = 1

memory_image = examples/memory_image.txt
dump_memory_image = outputs/hbm4_storage/final_memory.txt
dump_memory_csv = outputs/hbm4_storage/final_memory.csv
mismatch_report = outputs/hbm4_storage/mismatch_report.txt
dump_thermal_map = outputs/hbm4_storage/thermal_map.txt

# 统一后端参数。sparse 不要求文件；切到 mmap_sparse/chunk_file 时必须通过 CLI
# 或取消下方 memory_data_file 注释来提供路径。容量 0 表示从当前 spec 推导。
memory_backend = sparse
memory_capacity_bytes = 0
# memory_data_file = outputs/hbm4_storage/backend/hbm4.bin
memory_chunk_size = 2097152
memory_chunk_cache_entries = 16
sparse_density_warning_pct = 30
topology_stats_scan_limit = 100000

floorplan = true
power_model = true
thermal_model = true
power_scale = 1.0
thermal_ambient_c = 40
thermal_cooling_per_cycle = 0.00025
thermal_rise_c_per_pj = 0.00002

# 默认 configured_pj 使用 StorageModelOptions 的研究默认命令能量。若要验证
# DRAMsim3 风格 VDD×IDD×时间公式，使用：
#   --power-source dramsim3_idd --power-vdd 1.2 \
#   --idd0 65 --idd2n 40 --idd3n 55 --idd4r 390 --idd4w 500 \
#   --idd5ab 250 --idd5pb 5 --idd6x 31 --idd-devices-per-rank 1 \
#   --thermal-grid-cols-per-tile 4 --thermal-grid-rows-per-tile 4
# 这些 IDD 示例源自 DRAMsim3 HBM2 路径，只用于公式回归，不是 HBM4 厂商值。
