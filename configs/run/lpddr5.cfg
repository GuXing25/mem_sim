# LPDDR5 Ramulator2.1-derived 研究基线。
#
# 用本文件作为 LPDDR6 实验的 LPDDR5 对照。项目尚未导入完整 LPDDR5
# JEDEC/厂商时序表，因此该配置标记为 Ramulator2.1-derived 研究基线。

standard = lpddr5
timing_profile = lpddr5_generic
timing_profile_file = configs/profiles/lpddr5/ramulator2_6400_16gb.cfg
vendor_profile = ramulator2_baseline
mode_profile = default

speed_bin_mbps = 6400
density_gb = 16

pattern = stream
requests = 10000
read_ratio = 100
addr_stride = 64
address_mapping = default
inject_interval = 1

read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 512

refresh_policy = per_bank
rfm_policy = per_bank

lpddr_link_protection = false
lpddr_dvfs_mode = nominal
lpddr_wck_mode = cas_sync
low_power_mode = off
metadata_bits_per_request = 0

max_cycles = 100000000
