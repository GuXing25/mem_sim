# hbm_sim LPDDR 家族唯一权威配置（schema v2）。
# 在 [model] 或 CLI 选择 LPDDR5/LPDDR6；所有已实现参数均可覆盖。非标准组合只能作为
# LPDDR5/LPDDR6 语义派生的 exploratory 研究模型，不能冒充已校准器件。

[meta]
schema_version = 2  # 配置语法版本；2 表示采用 section 分层，不改变 DRAM 协议或物理参数

[model]
name = lpddr_exploration  # 当前模型或 preset 的可读名称，可按实验用途自定义
base_standard = lpddr6  # 基础协议标准；HBM 可选 hbm3/hbm4，LPDDR 可选 lpddr5/lpddr6

[validation]
mode = exploratory  # 可信度模式；可选 exploratory、standard、device
strict_timing_table = false  # 是否要求完整 Timing 来源表；true 严格检查，false 允许研究缺口

[system]
stack_count = 1  # 独立存储 Stack/器件实例数量，必须为正整数，可按系统规模设置
stack_mapping = interleaved  # 系统地址到 Stack 的映射；可选 interleaved 或 blocked
stack_interleave_bytes = 256  # 多 Stack 条带粒度，单位 Byte，必须是 line_size 的整数倍
stack_ingress_buffer_size = 256  # 每个 Stack 的入口队列深度，按并发压力设为正整数
stack_dispatch_width = 4  # 每个 Stack 每拍最多分发的事务数，按目标带宽设定
stack_qos_policy = strict_priority  # Stack 入口 QoS；可选 fcfs 或 strict_priority
# response_delivery_mode = disabled  # 外部响应视图；未设置时由 response trace 自动推导
host_response_queue_capacity = 0  # HostResponse 队列容量；0 表示无限，满时反压完成路径
transaction_response_queue_capacity = 0  # 子事务响应队列容量；0 表示无限，满时反压完成路径

[workload]
pattern = stream  # 合成流量模式；可选 stream 或 random，使用 trace 时可由外部请求替代
requests = 10000  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
random_address_space_bytes = 0  # random 聚合地址空间上限，单位 Byte；0 使用模型总容量
addr_stride = 64  # stream 模式相邻请求地址步长，单位 Byte，通常为 cache-line 大小
inject_interval = 1  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
init_sequence = none  # 启动控制序列；LPDDR 可选 none、auto、lpddr、lpddr5、lpddr6、lpddr6_full
init_sequence_interval = 1  # 初始化控制命令之间的基础间隔，单位 controller tick
max_cycles = 100000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
progress_interval = 0  # 每 N 个 system cycle 向 stderr 打印进度；0 关闭
stats_view = full  # stdout 统计视图；summary 为关键指标，full 为完整分组指标

[controller]
read_buffer_size = 128  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 128  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 512  # 刷新、RFM 和控制命令优先队列容量，单位条目
write_low_watermark = 0.2  # 写排空低水位，范围 0~1，低于此比例可退出写优先阶段
write_high_watermark = 0.8  # 写排空高水位，范围 0~1，达到后进入写优先阶段

[controller.scheduler]
type = frfcfs  # 控制器调度算法；可选 fcfs 或 frfcfs，陌生名称会报错

[controller.row_policy]
type = open_page  # 行策略；可选 open_page、closed_page、closed_cap
cap = 4  # closed_cap 行策略的命令/命中上限，必须为正整数

[mapping]
address_mapping = default  # DRAM 地址映射模板；可选 default、RoBaRaCoCh、ChRaBaRoCo、RoCoRaBaCh
channel_mapper = decoded  # 请求到 Channel 的分派；可选 decoded、round_robin、xor

[phy]
mode = behavioral  # Mem PHY 模式；可选 direct 或 behavioral
protocol = lpddr  # PHY 协议族；HBM 配置使用 hbm，LPDDR 配置使用 lpddr
dfi_version = 6.0.1  # DFI 接口语义参考标签；当前不会按版本切换行为，也不表示一致性认证
command_fifo_depth = 32  # Behavioral PHY 命令 FIFO 深度，单位条目
read_fifo_depth = 32  # Behavioral PHY 读返回 FIFO 深度，单位条目
write_fifo_depth = 32  # Behavioral PHY 写数据 FIFO 深度，单位条目
command_pipeline_cycles = 1  # PHY 命令流水线延迟，单位 controller tick
read_return_pipeline_cycles = 1  # PHY 读返回附加流水线延迟，单位 controller tick
write_data_pipeline_cycles = 1  # PHY 写数据附加流水线延迟，单位 controller tick
reset_cycles = 4  # PHY 复位阶段持续时间，单位 controller tick
initialization_cycles = 4  # PHY 初始化阶段持续时间，单位 controller tick
training_cycles = 8  # PHY 训练阶段持续时间，单位 controller tick
auto_train = true  # 是否自动执行 PHY 生命周期；true 自动训练，false 由外部驱动

[maintenance]
supports_refresh = true  # 是否启用刷新命令和调度；true 启用，false 关闭
refresh_policy = per_bank  # 刷新范围；可选 per_bank 或 all_bank，LPDDR6 per_bank 对应 REFdb
refresh_temperature_mode = normal  # 刷新温度档；可选 normal、high、extended
refresh_high_temp_multiplier = 2  # 高温刷新频率倍率，正整数；数值越大刷新间隔越短
refresh_postpone_limit = 0  # 允许推迟的刷新义务上限；0 表示禁止 postpone
refresh_pullin_limit = 0  # 允许提前执行的刷新次数上限；0 表示禁止 pull-in
refresh_credit_limit = 0  # 刷新 credit 绝对上限；0 表示不额外限制
rfm_policy = per_bank  # RFM 范围；可选 per_bank 或 all_bank
rfm_act_threshold = 512  # 触发 RFM 的 ACT/RAA 阈值，按研究或器件规则设置
rfm_decrement = 512  # RFM 完成后计数器递减量，按研究或器件规则设置
low_power_mode = off  # 低功耗模式；可选 off、power_down、self_refresh
low_power_entry_cycles = 0  # 进入低功耗状态的空闲门限，单位 controller tick
low_power_exit_cycles = 0  # 退出 power-down 的恢复延迟，单位 controller tick
self_refresh_exit_cycles = 0  # 退出 self-refresh 的恢复延迟，单位 controller tick

[storage]
backend = sparse  # 数据后端；可选 sparse、mmap_sparse、chunk_file
capacity_bytes = 0  # 文件后端容量，单位 Byte；0 表示按模型可寻址容量自动计算
chunk_size = 2097152  # chunk_file 后端块大小，单位 Byte，必须为正整数
chunk_cache_entries = 64  # chunk_file 内存缓存块数量，按宿主机内存预算设置
sparse_density_warning_pct = 1.0  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 1000000  # 物理拓扑统计最多扫描的已分配 line 数
floorplan = true  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
subarrays_per_bank = 16  # 每 Bank 的 Subarray 数量，用于物理坐标映射
mats_per_subarray_x = 4  # 每 Subarray 在 X 方向的 Mat 数量
mats_per_subarray_y = 4  # 每 Subarray 在 Y 方向的 Mat 数量
cells_per_mat_x = 512  # 每 Mat 在 X 方向的 Cell 数量
cells_per_mat_y = 512  # 每 Mat 在 Y 方向的 Cell 数量
microbumps_x = 8  # 接口 Microbump 网格 X 方向数量
microbumps_y = 8  # 接口 Microbump 网格 Y 方向数量

[reliability.payload]
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow
ecc_correct_single_bit = true  # 是否自动纠正单比特错误

[reliability]
# Generic interface-accounting fields; LPDDR DBI/link-ECC fields are selected below.
metadata_bits_per_request = 0  # 每个事务计入接口带宽的通用元数据位数
ecc_bits_per_request = 0  # 每个事务计入接口带宽的通用 ECC 位数

[fault_injection]
ecc_inject_period = 0  # ECC 故障注入周期；0 关闭，正整数表示每 N 次机会注入

[power]
enabled = true  # 是否启用当前 preset 的功耗模型；true 启用，false 关闭
source = configured_pj  # 功耗参数来源；可选 configured_pj 或 dramsim3_idd
scale = 1.0  # 功耗统一缩放系数，1.0 表示不缩放
power_act_pj = 520  # ACT 命令基础能量，单位 pJ
power_act1_pj = 280  # LPDDR ACT1 命令能量，单位 pJ
power_act2_pj = 280  # LPDDR ACT2 命令能量，单位 pJ
power_pre_pj = 190  # 单 Bank PRE 命令能量，单位 pJ
power_preab_pj = 1200  # 全 Bank PREab 命令能量，单位 pJ
power_cas_pj = 45  # CAS 同步/控制命令能量，单位 pJ
power_read_pj = 340  # 每次读事务固定能量，单位 pJ
power_read_per_byte_pj = 2.0  # 读 payload 每 Byte 附加能量，单位 pJ/Byte
power_write_pj = 390  # 每次写事务固定能量，单位 pJ
power_write_per_byte_pj = 2.4  # 写 payload 每 Byte 附加能量，单位 pJ/Byte
power_refpb_pj = 950  # 单 Bank 刷新能源，单位 pJ
power_refdb_pj = 1500  # LPDDR 双 Bank REFdb 能量，单位 pJ
power_refab_pj = 4200  # 全 Bank 刷新能源，单位 pJ
power_rfmpb_pj = 1250  # 单 Bank RFM 能量，单位 pJ
power_rfmab_pj = 5200  # 全 Bank RFM 能量，单位 pJ
power_control_pj = 120  # MRW/DVFS/训练等控制命令基础能量，单位 pJ
power_vdd = 1.2  # IDD 功耗换算使用的电压，单位 V
idd0 = 65  # IDD0 工作电流参数，单位 mA，需按器件资料校准
idd2n = 40  # IDD2N 预充电待机电流，单位 mA
idd3n = 55  # IDD3N 激活待机电流，单位 mA
idd4r = 390  # IDD4R 连续读电流，单位 mA
idd4w = 500  # IDD4W 连续写电流，单位 mA
idd5ab = 250  # IDD5AB 全 Bank 刷新电流，单位 mA
idd5pb = 5  # IDD5PB 单 Bank 刷新电流，单位 mA
idd6x = 31  # IDD6x 自刷新/低功耗电流，单位 mA
idd_devices_per_rank = 1  # IDD 换算中每 Rank 并联器件数量，必须为正整数
idd_burst_cycles = 0  # IDD burst 计能持续周期；0 表示按命令/Timing 自动推导

[thermal]
enabled = true  # 是否启用当前 preset 的热模型；true 启用，false 关闭
ambient_c = 40  # 环境初始温度，单位摄氏度
cooling_per_cycle = 0.00025  # 每 tick 向环境冷却的比例系数
rise_c_per_pj = 0.00002  # 能量到温升的简化换算系数，单位 摄氏度/pJ
thermal_grid_cols_per_tile = 1  # 每个 floorplan tile 的热网格列数
thermal_grid_rows_per_tile = 1  # 每个 floorplan tile 的热网格行数
thermal_coupling = true  # 是否启用横向、纵向和 TSV 热耦合
lateral_coupling = 0.02  # 同层相邻热网格的耦合系数，建议范围 0~0.25
vertical_coupling = 0.012  # 相邻层热网格的基础耦合系数，建议范围 0~0.25
thermal_tsv_coupling_scale = 0.03  # TSV 通道对纵向热耦合的附加缩放系数
thermal_tsvs_per_grid = 4  # 每个热网格单元假设的 TSV 数量
thermal_chip_dim_x_m = 0.01  # 芯片/器件 X 方向物理尺寸，单位 m
thermal_chip_dim_y_m = 0.01  # 芯片/器件 Y 方向物理尺寸，单位 m
thermal_tsv_radius_m = 0.000005  # TSV 半径，单位 m
thermal_k_silicon = 148  # 硅材料导热系数，单位 W/(m·K)
thermal_k_copper = 401  # 铜材料导热系数，单位 W/(m·K)

[outputs]
validate_cmd_trace = false  # 是否在运行结束后校验命令 trace；true 校验，false 跳过
validate_dfi_trace = false  # 是否在运行结束后校验 DFI trace；true 校验，false 跳过
fail_on_data_mismatch = true  # 读数据不匹配时是否返回失败退出码
# cmd_trace = outputs/<run>/commands.csv  # 命令 trace CSV 输出路径；多 Stack 时可使用 {stack} 占位符
# response_trace = outputs/<run>/host_responses.csv  # 重组后的 HostResponse CSV 输出路径
# transaction_response_trace = outputs/<run>/transaction_responses.csv  # DRAM 子事务响应 CSV 输出路径
# dfi_trace = outputs/<run>/dfi.csv  # DFI command/data beat CSV 输出路径，可按实验目录自定义
# dfi_signal_trace = outputs/<run>/dfi_signals.csv  # DFI signal-like CSV 输出路径，可按实验目录自定义
# dump_timing_table = outputs/<run>/timing.csv  # 最终生效 Timing 表 CSV 输出路径，用于审计参数及来源
# dump_thermal_map = outputs/<run>/thermal.csv  # 热网格 CSV 输出路径；多 Stack 时可使用 {stack} 占位符

[standard.lpddr5]
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
lpddr_dual_bank_refresh = false  # 是否将 per-bank 刷新建模为 LPDDR6 REFdb 双 Bank 刷新
lpddr_link_protection = false  # 是否启用 LPDDR 链路保护总开关
lpddr_dvfs_mode = disabled  # LPDDR DVFS 档；可选 nominal、low、disabled
lpddr_low_data_rate_mbps = 0  # LPDDR 低 DVFS 档数据率，单位 Mb/s/pin
lpddr_wck_mode = cas_sync  # LPDDR WCK 模式；当前实现 cas_sync、always_on
lpddr_wck_ratio = 4  # WCK 与 CK 的频率倍率，按协议工作模式设置
lpddr_mode_register_profile = ramulator2_baseline  # LPDDR RL/WL/BL 模式寄存器组合名称
lpddr_wck_training_mode = cas_sync_only  # LPDDR WCK 训练流程名称，用于行为与审计
lpddr_dvfs_transition_policy = disabled  # LPDDR DVFS 切换策略名称，用于行为与审计
lpddr_link_protection_mode = off  # LPDDR 链路保护组合名称，例如 off 或 DBI/ECC 组合
lpddr_low_power_state_policy = controller_idle  # LPDDR 低功耗状态进入/退出策略名称
lpddr_wck_training_required = false  # 是否要求执行 WCK 训练后才能进行数据传输
lpddr_dbi_enabled = false  # 是否启用 LPDDR Data Bus Inversion
lpddr_link_ecc_enabled = false  # 是否启用 LPDDR 链路 ECC
lpddr_ca_parity_enabled = false  # 是否启用 LPDDR CA parity
lpddr_dbi_bits_per_request = 0  # 每个事务计入接口带宽的 DBI 位数
lpddr_link_ecc_bits_per_request = 0  # 每个事务计入接口带宽的链路 ECC 位数
lpddr_ca_parity_bits_per_command = 1  # 每条 LPDDR 命令计入接口带宽的 CA parity 位数

[standard.lpddr5.organization]
timing_profile = lpddr5_ramulator2_6400_16gb  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = generic  # 厂商参数集名称；generic 表示尚未完成真实器件校准
mode_profile = default  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
speed_bin_mbps = 6400  # 目标 speed-bin，单位 Mb/s/pin，可按研究或器件规格设置
density_gb = 16  # 单 die/器件标称密度，单位 Gb，用于组织和刷新参数选择
data_rate_mbps = 6400  # 接口数据率，单位 Mb/s/pin
data_bus_bits = 16  # 一个存储实例的接口总数据位宽，单位 bit
prefetch_size = 16  # DRAM 内部预取宽度/突发基数，按协议模式设置
tick_multiplier = 1  # 每个 nCK 划分的 controller tick 数；HBM 边沿模型通常为 2
tCK_ps = 1250  # DRAM 时钟周期，单位 ps；改变速率时需同步校准 Timing
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 1  # 每 Channel 的 Pseudo-channel/Subchannel 数量
sids = 1  # 每 Pseudo-channel 的 SID 数量；不支持 SID 的模型设为 1
ranks = 1  # 每 Channel 层级中的 Rank 数量，必须为正整数
bank_groups = 4  # 每 Rank 的 Bank Group 数量；LPDDR6 REFdb 要求可成对
banks_per_group = 4  # 每 Bank Group 的 Bank 数量
rows = 65536  # 每 Bank 的 Row 数量，影响容量和地址解码
columns = 1024  # 每 Row 的事务 Column 数量，影响容量和行命中
line_size = 64  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 0  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导

[standard.lpddr5.timing_reference]
source = external_reference  # Timing 来源标签；可选 jedec、vendor、external_reference、research_default、derived
reference = Ramulator2.1-derived LPDDR5 6400 baseline; not a calibrated device table.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nBL = 2  # 突发占用长度，单位 nCK
nCL = 17  # 读命令到数据返回的 CAS latency，单位 nCK
nCWL = 9  # 写命令到写数据的 CAS write latency，单位 nCK
nRCDRD = 15  # 激活到读命令的最小间隔，单位 nCK
nRCDWR = 15  # 激活到写命令的最小间隔，单位 nCK
nRP = 15  # 单 Bank 预充电恢复时间，单位 nCK
nRPab = 17  # 全 Bank 预充电恢复时间，单位 nCK
nRAS = 34  # Row 保持激活的最短时间，单位 nCK
nRC = 49  # 同 Bank Row cycle 最小周期，单位 nCK
nRTP = 8  # 读到预充电的最小间隔，单位 nCK
nWR = 28  # 写恢复时间，单位 nCK
nCCDS = 2  # 短列命令间隔，单位 nCK
nCCDL = 4  # 同 Bank Group 长列命令间隔，单位 nCK
nRRDS = 4  # 短 ACT-to-ACT 间隔，单位 nCK
nRRDL = 4  # 长 ACT-to-ACT 间隔，单位 nCK
nFAW = 16  # 四次激活窗口宽度，单位 nCK
nAADMin = 1  # LPDDR ACT1 后最早允许发 ACT2 的时间，单位 nCK
nAADMax = 8  # LPDDR ACT1 后最晚必须发 ACT2 的 deadline，单位 nCK
nWCK2CK = 1  # WCK/CAS 同步到数据命令的等待时间，单位 nCK
nWCKPST = 1  # WCK postamble/保持窗口，单位 nCK
nCAS = 0  # LPDDR CAS 同步窗口或相关控制延迟，单位 nCK
nCS = 2  # Chip-select/命令选择相关间隔，单位 nCK
nPPD = 2  # 连续 PRE 命令最小间隔，单位 nCK
nWTRS = 5  # 短写转读间隔，单位 nCK
nWTRL = 10  # 长写转读间隔，单位 nCK
nRFC = 224  # 全 Bank refresh recovery，单位 nCK
nRFCpb = 112  # 单/双 Bank refresh recovery，单位 nCK
nREFI = 3125  # 全 Bank 刷新平均间隔，单位 nCK
nREFIpb = 391  # 单/双 Bank 刷新调度间隔，单位 nCK
nWCKSYNC = 1  # WCK 同步命令延迟，单位 nCK
nWCKTRAIN = 0  # WCK 训练持续时间，单位 nCK
nDVFS = 0  # DVFS 切换持续时间，单位 nCK
nPDEX = 0  # Power-down 退出恢复时间，单位 nCK
nSREFEX = 0  # Self-refresh 退出恢复时间，单位 nCK

[standard.lpddr6]
supports_rfm = true  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
lpddr_dual_bank_refresh = true  # 是否将 per-bank 刷新建模为 LPDDR6 REFdb 双 Bank 刷新
lpddr_efficiency_mode = normal  # LPDDR 效率模式；可选 normal、static、dynamic
