# hbm_sim LPDDR 家族唯一权威配置（schema v2）。
# 在 [model] 或 CLI 选择 LPDDR5/LPDDR6；所有已实现参数均可覆盖。非标准组合只能作为
# LPDDR5/LPDDR6 语义派生的 exploratory 研究模型，不能冒充已校准器件。

[meta]
schema_version = 2

[model]
name = lpddr_exploration
base_standard = lpddr6
preset = baseline

[validation]
mode = exploratory
strict_timing_table = false

[system]
stack_count = 1
stack_mapping = interleaved
stack_interleave_bytes = 256
stack_ingress_buffer_size = 256
stack_dispatch_width = 4
stack_qos_policy = strict_priority

[workload]
pattern = stream
requests = 10000
read_ratio = 100
seed = 1
addr_stride = 64
inject_interval = 1
init_sequence = none
init_sequence_interval = 1
max_cycles = 100000000

[controller]
read_buffer_size = 128
write_buffer_size = 128
priority_buffer_size = 512
write_low_watermark = 0.2
write_high_watermark = 0.8

[controller.scheduler]
type = frfcfs

[controller.row_policy]
type = open_page
cap = 4

[mapping]
address_mapping = default
channel_mapper = decoded

[phy]
mode = behavioral
protocol = lpddr
dfi_version = 6.0.1
command_fifo_depth = 32
read_fifo_depth = 32
write_fifo_depth = 32
command_pipeline_cycles = 1
read_return_pipeline_cycles = 1
write_data_pipeline_cycles = 1
reset_cycles = 4
initialization_cycles = 4
training_cycles = 8
auto_train = true

[maintenance]
supports_refresh = true
refresh_policy = per_bank
refresh_temperature_mode = normal
refresh_high_temp_multiplier = 2
refresh_postpone_limit = 0
refresh_pullin_limit = 0
refresh_credit_limit = 0
rfm_policy = per_bank
rfm_act_threshold = 512
rfm_decrement = 512
low_power_mode = off
low_power_entry_cycles = 0
low_power_exit_cycles = 0
self_refresh_exit_cycles = 0

[storage]
backend = sparse
capacity_bytes = 0
chunk_size = 2097152
chunk_cache_entries = 64
sparse_density_warning_pct = 1.0
topology_stats_scan_limit = 1000000
floorplan = true
subarrays_per_bank = 16
mats_per_subarray_x = 4
mats_per_subarray_y = 4
cells_per_mat_x = 512
cells_per_mat_y = 512
microbumps_x = 8
microbumps_y = 8

[reliability.payload]
ecc_shadow = true
ecc_check_on_read = true
ecc_correct_single_bit = true

[reliability]
# Generic interface-accounting fields; LPDDR DBI/link-ECC fields are selected below.
metadata_bits_per_request = 0
ecc_bits_per_request = 0

[fault_injection]
ecc_inject_period = 0

[power]
enabled = true
source = configured_pj
scale = 1.0
power_act_pj = 520
power_act1_pj = 280
power_act2_pj = 280
power_pre_pj = 190
power_preab_pj = 1200
power_cas_pj = 45
power_read_pj = 340
power_read_per_byte_pj = 2.0
power_write_pj = 390
power_write_per_byte_pj = 2.4
power_refpb_pj = 950
power_refdb_pj = 1500
power_refab_pj = 4200
power_rfmpb_pj = 1250
power_rfmab_pj = 5200
power_control_pj = 120
power_vdd = 1.2
idd0 = 65
idd2n = 40
idd3n = 55
idd4r = 390
idd4w = 500
idd5ab = 250
idd5pb = 5
idd6x = 31
idd_devices_per_rank = 1
idd_burst_cycles = 0

[thermal]
enabled = true
ambient_c = 40
cooling_per_cycle = 0.00025
rise_c_per_pj = 0.00002
thermal_grid_cols_per_tile = 1
thermal_grid_rows_per_tile = 1
thermal_coupling = true
lateral_coupling = 0.02
vertical_coupling = 0.012
thermal_tsv_coupling_scale = 0.03
thermal_tsvs_per_grid = 4
thermal_chip_dim_x_m = 0.01
thermal_chip_dim_y_m = 0.01
thermal_tsv_radius_m = 0.000005
thermal_k_silicon = 148
thermal_k_copper = 401
thermal_k_insulator = 1.5
thermal_k_heatsink = 4
thermal_c_silicon = 1660000
thermal_c_copper = 3200000
thermal_c_insulator = 1650000
thermal_c_heatsink = 2420000
thermal_layer_height_si_m = 0.0004
thermal_layer_height_cu_m = 0.000005
thermal_layer_height_insulator_m = 0.00002

[outputs]
validate_cmd_trace = false
validate_dfi_trace = false
fail_on_data_mismatch = true
# cmd_trace = outputs/<run>/commands.csv
# response_trace = outputs/<run>/responses.csv
# dfi_trace = outputs/<run>/dfi.csv
# dfi_signal_trace = outputs/<run>/dfi_signals.csv
# dump_timing_table = outputs/<run>/timing.csv
# dump_thermal_map = outputs/<run>/thermal.csv

