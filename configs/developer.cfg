# 开发者专用参数集。使用时先加载对应标准主配置，再加载本文件：
#   --config configs/hbm.cfg --config configs/developer.cfg --standard hbm4 --preset synthetic_9000_48gb_16hi
#   --config configs/lpddr.cfg --config configs/developer.cfg --standard lpddr6 --preset synthetic_linkprot
# 本文件中的 synthetic/research 参数只用于软件路径、边界和压力测试，不表示真实器件参数。

[preset.hbm4.storage_demo.storage]
model_name = hbm4_storage_demo  # 模型实例名称，仅用于标识和审计，可自行命名
memory_backend = sparse  # preset 覆盖的数据后端；可选 sparse、mmap_sparse、chunk_file
floorplan = true  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = true  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = true  # 是否启用热模型；true 启用，false 关闭
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow
ecc_correct_single_bit = true  # 是否自动纠正单比特错误

[preset.hbm4.synthetic_9000_48gb_16hi.organization]
model_name = hbm4_synthetic_9000_48gb_16hi  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = hbm4_synthetic_9000_48gb_16hi  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = synthetic_research  # 合成研究参数集名称；不是厂商器件配置
mode_profile = full_stack_crc16_ras_test  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
speed_bin_mbps = 9000  # 目标 speed-bin，单位 Mb/s/pin，可按研究或器件规格设置
density_gb = 48  # 单 die/器件标称密度，单位 Gb，用于组织和刷新参数选择
stack_height = 16  # HBM Stack 的 DRAM die 层数；LPDDR 通常不使用该层级
data_rate_mbps = 9000  # 接口数据率，单位 Mb/s/pin
tCK_ps = 444  # DRAM 时钟周期，单位 ps；改变速率时需同步校准 Timing
sids = 4  # 每 Pseudo-channel 的 SID 数量；不支持 SID 的模型设为 1
hbm_edge_pairing_matrix = hbm4_synthetic_full_matrix  # HBM edge-pairing 规则表名称，需与目标标准匹配
hbm_sid_mapping = sid_per_4hi_slice  # HBM SID 到 die/layer 的映射方案名称
hbm_ras_policy = ras_metadata_sideband  # HBM RAS/错误处理策略名称，当前按已实现语义选择
hbm_link_crc_mode = crc16  # HBM 链路 CRC 模式；当前实现 off、crc16
hbm_link_retry_enabled = true  # 是否启用 HBM 链路重试/重放行为入口
hbm_link_crc_bits_per_request = 16  # 每个 HBM 事务计入接口带宽的 CRC 位数
hbm_ras_metadata_bits_per_request = 16  # 每个 HBM 事务计入接口带宽的 RAS 元数据位数
hbm_ecc_bits_per_request = 16  # 每个 HBM 事务计入接口带宽的 ECC 位数

[preset.hbm4.synthetic_9000_48gb_16hi.timing_research]
source = research_default  # 合成研究 Timing 来源；不得用于器件级数值声明
reference = Synthetic vendor-like HBM4 test values; not a real vendor datasheet.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nBL = 2  # 突发占用长度，单位 nCK
nCL = 36  # 读命令到数据返回的 CAS latency，单位 nCK
nCWL = 12  # 写命令到写数据的 CAS write latency，单位 nCK
nRCDRD = 36  # 激活到读命令的最小间隔，单位 nCK
nRCDWR = 20  # 激活到写命令的最小间隔，单位 nCK
nRP = 36  # 单 Bank 预充电恢复时间，单位 nCK
nRPab = 36  # 全 Bank 预充电恢复时间，单位 nCK
nRAS = 64  # Row 保持激活的最短时间，单位 nCK
nRC = 100  # 同 Bank Row cycle 最小周期，单位 nCK
nRTP = 10  # 读到预充电的最小间隔，单位 nCK
nWR = 34  # 写恢复时间，单位 nCK
nCCDS = 2  # 短列命令间隔，单位 nCK
tCCDL_ns = 2.5  # 长列命令间隔的时间制输入，单位 ns；解析时按 tCK 向上取整
nCCDR = 4  # HBM 不同 SID 连续读间隔，单位 nCK
nRRDS = 10  # 短 ACT-to-ACT 间隔，单位 nCK
nRRDL = 12  # 长 ACT-to-ACT 间隔，单位 nCK
nFAW = 36  # 四次激活窗口宽度，单位 nCK
nRTW = 30  # 读转写总线换向间隔，单位 nCK
nWTRS = 12  # 短写转读间隔，单位 nCK
nWTRL = 16  # 长写转读间隔，单位 nCK
tRFCab_ns = 560  # 全 Bank refresh recovery 的时间制输入，单位 ns
tRFCpb_ns = 350  # 单 Bank refresh recovery 的时间制输入，单位 ns
tRREFD_ns = 8  # 刷新命令最小间隔的时间制输入，单位 ns
tREFI_us = 3.9  # 全 Bank 刷新平均间隔，单位 μs
tREFIpb_ns = 60.9375  # 单/双 Bank 刷新平均间隔，单位 ns
nRFMab = 1262  # 全 Bank RFM recovery，单位 nCK
nRFMpb = 789  # 单 Bank RFM recovery，单位 nCK
nMRW = 10  # Mode Register Write 执行延迟，单位 nCK
nMRR = 10  # Mode Register Read 执行延迟，单位 nCK
nECCSCRUB = 160  # ECC scrub 控制操作持续时间，单位 nCK
nRASERR = 96  # RAS 错误处理操作持续时间，单位 nCK
nLINKRETRY = 40  # 链路 retry/replay 阻塞时间，单位 nCK

[preset.lpddr6.synthetic_linkprot.organization]
model_name = lpddr6_synthetic_linkprot  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = lpddr6_synthetic_10667_16gb_linkprot  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = synthetic_research  # 合成研究参数集名称；不是厂商器件配置
mode_profile = dvfsl_linkprot_on_eff_on_bl24_test  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
lpddr_link_protection = true  # 是否启用 LPDDR 链路保护总开关
lpddr_link_ecc_enabled = true  # 是否启用 LPDDR 链路 ECC
lpddr_link_ecc_bits_per_request = 16  # 每个事务计入接口带宽的链路 ECC 位数
lpddr_dbi_enabled = true  # 是否启用 LPDDR Data Bus Inversion
lpddr_dbi_bits_per_request = 8  # 每个事务计入接口带宽的 DBI 位数
lpddr_mode_register_profile = RLSet1_WLSetA_BL24_synthetic_linkprot  # LPDDR RL/WL/BL 模式寄存器组合名称
lpddr_link_protection_mode = link_ecc_crc_retry_synthetic  # LPDDR 链路保护组合名称，例如 off 或 DBI/ECC 组合

[preset.lpddr6.synthetic_linkprot.timing_research]
source = research_default  # 合成研究 Timing 来源；不得用于器件级数值声明
reference = Synthetic vendor-like LPDDR6 link-protection values; not a real datasheet.  # 该 Timing 参数组的来源说明，用于审计和声明边界
tWTP_ns = 20.7  # 写到预充电的时间制输入，单位 ns；解析时换算为写恢复约束
tWTR_S_ns = 14.1  # 短写转读的时间制输入，单位 ns
tWTR_L_ns = 20.7  # 长写转读的时间制输入，单位 ns
nRFMab = 747  # 全 Bank RFM recovery，单位 nCK
nRFMpb = 427  # 单 Bank RFM recovery，单位 nCK
nECCSCRUB = 86  # ECC scrub 控制操作持续时间，单位 nCK
nRASERR = 64  # RAS 错误处理操作持续时间，单位 nCK
nLINKRETRY = 43  # 链路 retry/replay 阻塞时间，单位 nCK

