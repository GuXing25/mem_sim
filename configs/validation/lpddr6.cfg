# LPDDR6 验证参数集。标准行为继承 lpddr.cfg，本文件保存 Ramulator2 共同面条件。

[meta]
extends = ../lpddr.cfg  # 继承 LPDDR5/LPDDR6 标准主配置；相对本文件目录解析

[model]
name = lpddr6_validation  # 验证运行的默认实例名称
base_standard = lpddr6  # 本验证集固定选择 LPDDR6 协议语义

[preset.lpddr6.ramulator2_reference_1ch.organization]
model_name = lpddr6_ramulator2_reference_1ch  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = lpddr6_ramulator2_10667_16gb_bl24  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = ramulator2_baseline  # 厂商参数集名称；generic 表示尚未完成真实器件校准
mode_profile = differential_x12_bl24  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 1  # 每 Channel 的 Pseudo-channel/Subchannel 数量
sids = 1  # 每 Pseudo-channel 的 SID 数量；不支持 SID 的模型设为 1
ranks = 1  # 每 Channel 层级中的 Rank 数量，必须为正整数
bank_groups = 4  # 每 Rank 的 Bank Group 数量；LPDDR6 REFdb 要求可成对
banks_per_group = 4  # 每 Bank Group 的 Bank 数量
rows = 65536  # 每 Bank 的 Row 数量，影响容量和地址解码
columns = 1024  # 每 Row 的事务 Column 数量，影响容量和行命中
line_size = 32  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
data_bus_bits = 12  # 一个存储实例的接口总数据位宽，单位 bit
prefetch_size = 24  # DRAM 内部预取宽度/突发基数，按协议模式设置
lpddr_mode_register_profile = ramulator2_x12_BL24  # LPDDR RL/WL/BL 模式寄存器组合名称
lpddr_wck_mode = always_on  # LPDDR WCK 模式；当前实现 cas_sync、always_on
lpddr_wck_training_mode = reference_always_on  # LPDDR WCK 训练流程名称，用于行为与审计
lpddr_wck_training_required = false  # 是否要求执行 WCK 训练后才能进行数据传输
lpddr_dvfs_transition_policy = disabled  # LPDDR DVFS 切换策略名称，用于行为与审计
lpddr_dvfs_mode = nominal  # LPDDR DVFS 档；可选 nominal、low、disabled
lpddr_low_data_rate_mbps = 3200  # LPDDR 低 DVFS 档数据率，单位 Mb/s/pin
lpddr_link_protection = false  # 是否启用 LPDDR 链路保护总开关
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
read_buffer_size = 32  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 32  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 2048  # 刷新、RFM 和控制命令优先队列容量，单位条目
requests = 0  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
max_cycles = 2000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # preset 覆盖的 PHY 复位时间，单位 controller tick
phy_initialization_cycles = 0  # preset 覆盖的 PHY 初始化时间，单位 controller tick
phy_training_cycles = 0  # preset 覆盖的 PHY 训练时间，单位 controller tick
floorplan = false  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = false  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = false  # 是否启用热模型；true 启用，false 关闭
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 物理拓扑统计最多扫描的已分配 line 数
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow

[preset.lpddr6.ramulator2_reference_1ch.timing_reference]
source = external_reference  # Timing 来源标签；可选 jedec、vendor、external_reference、research_default、derived
reference = Ramulator2.1 LPDDR6 x12/BL24 common-surface differential timing.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nBL = 6  # 突发占用长度，单位 nCK
nCL = 56  # 读命令到数据返回的 CAS latency，单位 nCK
nCWL = 26  # 写命令到写数据的 CAS write latency，单位 nCK
nRCDRD = 48  # 激活到读命令的最小间隔，单位 nCK
nRCDWR = 22  # 激活到写命令的最小间隔，单位 nCK
nRP = 107  # 单 Bank 预充电恢复时间，单位 nCK
nRPab = 115  # 全 Bank 预充电恢复时间，单位 nCK
nRAS = 54  # Row 保持激活的最短时间，单位 nCK
nRC = 169  # 同 Bank Row cycle 最小周期，单位 nCK
nRTP = 14  # 读到预充电的最小间隔，单位 nCK
nWR = 38  # 写恢复时间，单位 nCK
nCCDS = 6  # 短列命令间隔，单位 nCK
nCCDL = 10  # 同 Bank Group 长列命令间隔，单位 nCK
nRRDS = 10  # 短 ACT-to-ACT 间隔，单位 nCK
nRRDL = 10  # 长 ACT-to-ACT 间隔，单位 nCK
nFAW = 40  # 四次激活窗口宽度，单位 nCK
nAADMin = 1  # LPDDR ACT1 后最早允许发 ACT2 的时间，单位 nCK
nAADMax = 8  # LPDDR ACT1 后最晚必须发 ACT2 的 deadline，单位 nCK
nWCK2CK = 2  # WCK/CAS 同步到数据命令的等待时间，单位 nCK
nWCKPST = 3  # WCK postamble/保持窗口，单位 nCK
nCAS = 2  # LPDDR CAS 同步窗口或相关控制延迟，单位 nCK
nCS = 2  # Chip-select/命令选择相关间隔，单位 nCK
nPPD = 4  # 连续 PRE 命令最小间隔，单位 nCK
nWTRS = 17  # 短写转读间隔，单位 nCK
nWTRL = 32  # 长写转读间隔，单位 nCK
nRTW = 41  # 读转写总线换向间隔，单位 nCK
nRFC = 1014  # 全 Bank refresh recovery，单位 nCK
nRFCpb = 427  # 单/双 Bank refresh recovery，单位 nCK
nRFMab = 1014  # 全 Bank RFM recovery，单位 nCK
nRFMpb = 427  # 单 Bank RFM recovery，单位 nCK
nRREFD = 20  # 刷新相关最小命令间隔，单位 nCK
nREFI = 10416  # 全 Bank 刷新平均间隔，单位 nCK
nREFIpb = 1302  # 单/双 Bank 刷新调度间隔，单位 nCK
nWCKSYNC = 2  # WCK 同步命令延迟，单位 nCK
nWCKTRAIN = 171  # WCK 训练持续时间，单位 nCK
nDVFS = 342  # DVFS 切换持续时间，单位 nCK
nPDEX = 8  # Power-down 退出恢复时间，单位 nCK
nSREFEX = 256  # Self-refresh 退出恢复时间，单位 nCK
nREFDB2ACT = 20  # LPDDR6 REFdb 后到其他 Bank ACT 的恢复时间，单位 nCK
nREFDB2REFDBS = 126  # LPDDR6 REFdb 短配对间隔，单位 nCK
nREFDB2REFDBL = 240  # LPDDR6 REFdb 长配对间隔，单位 nCK


