# HBM4 外部参考差分配置。
#
# 显式固定组织、时序、请求宽度、调度器、行策略和维护配置，使 hbm_sim 与
# Ramulator2.1 可以运行相同的短地址序列。这是研究基线，不代表具体 HBM4 产品。
standard = hbm4
timing_profile_file = configs/profiles/hbm4/ramulator2_8000_32gb_8hi.cfg
timing_profile = hbm4_ramulator2_8000_32gb_8hi
vendor_profile = ramulator2_baseline
mode_profile = differential_single_channel

channels = 1
pseudo_channels = 2
sids = 2
ranks = 1
bank_groups = 2
banks_per_group = 8
rows = 16384
columns = 32
line_size = 32
data_bus_bits = 64
prefetch_size = 8
hbm_full_32_channel_stack = false
hbm_sid_interleave = true
hbm_pc_interleave = true
hbm_edge_pairing = true
hbm_strict_edge_pairing = true
hbm_edge_pairing_matrix = hbm4_jedec270_4a_row_col_pre_matrix
hbm_sid_mapping = sid_pair_8hi

supports_refresh = false
supports_rfm = false
supports_ecc = false
refresh_policy = per_bank
rfm_policy = per_bank

single_controller = true
scheduler = frfcfs
row_policy = open_page
address_mapping = default
channel_mapper = decoded
read_buffer_size = 16384
write_buffer_size = 16384
priority_buffer_size = 64
requests = 0
max_cycles = 2000000

dfi_phase_count = 2
dfi_data_lane_bytes = 16
dfi_read_latency_nck = 20
dfi_write_latency_nck = 10

floorplan = false
power_model = false
thermal_model = false
ecc_shadow = false
ecc_check_on_read = false
