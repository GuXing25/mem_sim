# HBM4 项目原生分析验证配置。
#
# 用于验证 hbm_sim 自身的控制器、存储、DFI 和带宽语义，不加载
# Ramulator2.1 差分配置。JEDEC-oriented 配置提供标准可见值，未确定的
# 器件参数继续明确标记为研究默认值。
standard = hbm4
timing_profile_file = configs/profiles/hbm4/jedec_8000_32gb_8hi.cfg
timing_profile = hbm4_project_native_8000_32gb_8hi
vendor_profile = generic
mode_profile = project_native_validation

channels = 1
pseudo_channels = 2
sids = 2
ranks = 1
bank_groups = 2
banks_per_group = 8
rows = 16384
columns = 32
# 本验证口径中，一次 HBM4 控制器可见传输为 32 字节；前端仍可把更大的
# 64 字节逻辑数据块或突发请求拆分成多次传输。
line_size = 32
data_bus_bits = 64
prefetch_size = 8
hbm_full_32_channel_stack = false
hbm_sid_interleave = true
hbm_pc_interleave = true
hbm_edge_pairing = true
hbm_strict_edge_pairing = true
hbm_edge_pairing_matrix = hbm4_jedec270_4a_row_col_pre_matrix
hbm_sid_mapping = sid_pair_8hi

supports_refresh = false
supports_rfm = false
supports_ecc = true
refresh_policy = per_bank
rfm_policy = per_bank

single_controller = true
scheduler = frfcfs
row_policy = open_page
address_mapping = default
channel_mapper = decoded
read_buffer_size = 16384
write_buffer_size = 16384
priority_buffer_size = 64
requests = 0
max_cycles = 2000000

dfi_phase_count = 2
dfi_data_lane_bytes = 16
dfi_read_latency_nck = 30
dfi_write_latency_nck = 10

memory_backend = sparse
floorplan = true
power_model = false
thermal_model = false
ecc_shadow = true
ecc_check_on_read = true
