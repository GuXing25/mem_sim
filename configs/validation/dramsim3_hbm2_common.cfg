# DRAMsim3 HBM2_4Gb_x128 common-command/power auxiliary baseline.
#
# hbm_sim has no HBM2 product model.  This intentionally instantiates the HBM3
# command-state machinery with the older simulator's public HBM timing and IDD
# inputs solely to exercise the shared ACT/PRE/RD/WR/REF and energy formulas.
# It must not be presented as an HBM3 device profile.
standard = hbm3
timing_profile = dramsim3_hbm2_common_abstraction
vendor_profile = dramsim3_reference
mode_profile = older_hbm_common_surface
timing_override_source = research_default

tCK_ps = 1000
nBL = 2
nCL = 14
nCWL = 4
nRCDRD = 14
nRCDWR = 14
nRP = 14
nRAS = 34
nRC = 48
nRTP = 4
nWR = 16
nCCDS = 1
nCCDL = 2
nCCDR = 2
nRRDS = 4
nRRDL = 6
nFAW = 30
nWTRS = 6
nWTRL = 8
nRTW = 16
nRFC = 260
nRFCpb = 260
nREFI = 3900
nREFIpb = 128

tick_multiplier = 1
channels = 1
pseudo_channels = 1
sids = 1
ranks = 1
bank_groups = 4
banks_per_group = 4
rows = 16384
columns = 64
line_size = 64
dram_transaction_bytes = 64
data_bus_bits = 128
prefetch_size = 4
hbm_full_32_channel_stack = false
hbm_sid_interleave = false
hbm_pc_interleave = false
hbm_edge_pairing = false
supports_refresh = false
supports_rfm = false
supports_ecc = false
single_controller = true
scheduler = frfcfs
row_policy = open_page
address_mapping = default
channel_mapper = decoded
max_cycles = 10000000

floorplan = true
power_model = true
thermal_model = true
power_source = dramsim3_idd
power_scale = 1.0
thermal_ambient_c = 40
thermal_chip_dim_x_m = 0.008
thermal_chip_dim_y_m = 0.008
power_vdd = 1.2
idd0 = 65
idd2n = 40
idd3n = 55
idd4r = 390
idd4w = 500
idd5ab = 250
idd5pb = 5
idd6x = 31
idd_devices_per_rank = 1
idd_burst_cycles = 2
