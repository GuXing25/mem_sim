# 可执行的 HX-HBM4-9000-48G-16Hi 研究用例。
# 先由 hbm.cfg 提供 HBM4 标准主配置，再通过 developer.cfg 中的 synthetic preset
# 提供研究 timing；本文件只保存该实验固定条件，不保存输出路径，避免对照运行覆盖基线。

[meta]
extends = ../../configs/developer.cfg  # 继承 synthetic HBM4 preset；运行时还需先加载 configs/hbm.cfg

[model]
name = hx_hbm4_9000_48gb_16hi_research  # 研究用例名称，只用于身份和结果审计
base_standard = hbm4  # 选择 HBM4 协议语义
preset = synthetic_9000_48gb_16hi  # 选择 developer.cfg 中的合成 9000/48Gb/16Hi 参数组

[override]
model_name = hx_hbm4_9000_48gb_16hi_research  # stdout/resolved config 的模型身份
timing_profile = hx_hbm4_9000_48gb_16hi_research  # 本实验 timing 身份，不对应真实厂商 speed-bin
vendor_profile = hypothetical_hx_research  # 明确标记为假想研究参数
mode_profile = full_stack_crc16_ras_research  # full-stack + CRC/RAS metadata 研究模式
validation_mode = exploratory  # 只允许架构趋势结论
strict_timing_table = false  # 仍含 research_default，不能启用厂家严格门槛

stack_count = 2  # 两颗独立 HBM Stack
stack_mapping = interleaved  # 系统地址按条带分布到两个 Stack
stack_interleave_bytes = 256  # Stack 条带大小，单位 Byte
stack_ingress_buffer_size = 256  # 每 Stack ingress 容量，单位 transaction
stack_dispatch_width = 4  # 每 Stack 每 system tick 最多分发的 transaction 数
stack_qos_policy = strict_priority  # ingress QoS 调度策略

pattern = random  # 合成随机地址 workload
requests = 20000  # HostRequest 数；HBM4 64B host line 会拆成两个 32B transaction
read_ratio = 70  # 读请求比例，百分数
seed = 900048  # 固定随机种子，保证可重放
addr_stride = 64  # 地址对齐/步长，单位 Byte
inject_interval = 2  # 相邻 host 请求注入间隔，单位 system tick
max_cycles = 100000000  # 运行周期上限，防止异常不收敛
address_mapping = RoBaRaCoCh  # 地址位到 DRAM 层级的映射顺序
channel_mapper = decoded  # 按地址解码结果选择 channel
read_buffer_size = 128  # 每 Controller 读队列容量，单位 transaction
write_buffer_size = 128  # 每 Controller 写队列容量，单位 transaction
priority_buffer_size = 4096  # 维护/控制优先队列容量
scheduler = frfcfs  # First-Ready FCFS 调度
row_policy = open_page  # 保持已打开行，允许利用行命中

mem_phy_mode = behavioral  # 启用行为级生命周期、FIFO、pipeline、adapter 和 DFI
phy_command_fifo_depth = 64  # 每 Controller PHY 命令 FIFO 深度
phy_read_fifo_depth = 64  # PHY 读返回 FIFO 深度
phy_write_fifo_depth = 64  # PHY 写数据 FIFO 深度
phy_command_pipeline_cycles = 2  # 命令 pipeline 延迟，单位 controller tick
phy_read_return_pipeline_cycles = 2  # 读返回 pipeline 延迟，单位 controller tick
phy_write_data_pipeline_cycles = 2  # 写数据 pipeline 延迟，单位 controller tick
phy_reset_cycles = 8  # PHY reset 生命周期，单位 controller tick
phy_initialization_cycles = 16  # PHY initialization 生命周期，单位 controller tick
phy_training_cycles = 32  # PHY training 生命周期，单位 controller tick
phy_auto_train = true  # 启动时自动完成 reset/init/training

refresh_policy = per_bank  # 使用 per-bank refresh 调度
rfm_policy = per_bank  # 使用 per-bank RFM 作用域
rfm_act_threshold = 256  # 单 bank 累积 ACT 达到该值时请求 RFM
rfm_decrement = 256  # RFM 完成后 ACT 计数递减量
refresh_postpone_limit = 4  # 最多推迟 refresh 的 credit 次数
refresh_pullin_limit = 4  # 最多提前 refresh 的 credit 次数
refresh_credit_limit = 8  # refresh credit 绝对上限
refresh_temperature_mode = normal  # 正常温度刷新倍率

memory_backend = sparse  # 默认使用宿主稀疏内存后端
memory_capacity_bytes = 0  # 0 表示每 Stack 使用 spec 派生的 96GiB 逻辑容量
sparse_density_warning_pct = 30  # 稀疏分配超过逻辑容量该百分比时告警
topology_stats_scan_limit = 100000  # 物理拓扑统计最多扫描的已分配 line 数
floorplan = true  # 派生 layer/tile/grid/subarray/mat/cell 坐标
subarrays_per_bank = 16  # 行映射使用的每 Bank subarray 数
mats_per_subarray_x = 8  # 每 subarray 的 X 方向 mat 数
mats_per_subarray_y = 8  # 每 subarray 的 Y 方向 mat 数
cells_per_mat_x = 512  # 每 mat 的 X 方向 cell 数
cells_per_mat_y = 512  # 每 mat 的 Y 方向 cell 数
microbumps_x = 64  # 行为级 microbump X 维数量
microbumps_y = 64  # 行为级 microbump Y 维数量
power_model = true  # 启用命令事件功耗
power_source = configured_pj  # 使用主配置中的研究型固定 pJ 参数
power_scale = 1.0  # 功耗能量缩放系数
thermal_model = true  # 启用稀疏行为级热模型
thermal_ambient_c = 40  # 环境初始温度，摄氏度
thermal_cooling_per_cycle = 0.00025  # 每 controller tick 向环境衰减的比例
thermal_rise_c_per_pj = 0.00002  # 每 pJ 事件能量的行为级温升系数
thermal_grid_cols_per_tile = 4  # 每 floorplan tile 的热网格 X 划分
thermal_grid_rows_per_tile = 4  # 每 floorplan tile 的热网格 Y 划分
thermal_coupling = true  # 启用横向/纵向邻域温差耦合
thermal_lateral_coupling = 0.05  # 同层邻域耦合系数
thermal_vertical_coupling = 0.10  # 相邻层基础耦合系数
thermal_tsv_coupling_scale = 1.25  # TSV 对纵向耦合的研究型增强系数
thermal_tsvs_per_grid = 16  # 每热网格假定 TSV 数量
ecc_shadow = true  # 启用 payload SECDED shadow
ecc_check_on_read = true  # 读取时检查 ECC shadow
ecc_correct_single_bit = true  # 自动纠正注入的单比特错误
ecc_inject_period = 0  # 0 表示本基线不周期性注错

validate_cmd_trace = true  # 运行后执行 command state/timing validator
validate_dfi_trace = true  # 运行后执行 DFI event/payload validator
fail_on_data_mismatch = true  # payload mismatch 时返回非零退出码
