[meta]
extends = ../../configs/hbm.cfg  # 相对本文件解析

[model]
name = my_hbm4_two_stack_research  # 结果中的可读名称
base_standard = hbm4  # 选择 HBM4 标准语义

[override]
stack_count = 2  # 独立 Stack 数
pattern = random  # 合成随机流量
read_ratio = 70  # 读比例，百分比
seed = 2026  # 固定随机序列，便于重放
inject_interval = 2  # system tick
scheduler = frfcfs  # 调度算法
row_policy = open_page  # 行策略
memory_backend = sparse  # payload 保存方式
